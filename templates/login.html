<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediBook</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">MediBook</a>
    </nav>

    <div class="form-container">
        <h2 class="form-title">Welcome Back</h2>
        
        <form action="/api/login" method="POST">
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.9rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 400;">
                    <input type="checkbox" style="width: auto;"> Remember me
                </label>
                <a href="/forgot-password" style="color: var(--secondary-color); text-decoration: none;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary">Login</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem;">
            Not Registered? <a href="/register" style="color: var(--secondary-color); text-decoration: none;">Create Account</a>
        </p>
    </div>
</body>
</html>
