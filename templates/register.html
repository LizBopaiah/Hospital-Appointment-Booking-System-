<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MediBook</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">MediBook</a>
    </nav>

    <div class="form-container">
        <h2 class="form-title">Create Account</h2>
        
        <div class="role-toggle">
            <button type="button" id="patientBtn" class="role-btn active" onclick="switchRole('patient')">Patient</button>
            <button type="button" id="doctorBtn" class="role-btn" onclick="switchRole('doctor')">Doctor</button>
        </div>

        <!-- Patient Form -->
        <form id="patientForm" action="/api/register/patient" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required placeholder="John Doe">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" required>
                </div>
            </div>
            <div class="form-group">
                <label>Blood Group</label>
                <select name="blood_group" required>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>
            <div class="form-group">
                <label>Security Question</label>
                <select name="security_question" required>
                    <option value="nickname">What is your childhood nickname?</option>
                    <option value="school">What was your first school name?</option>
                    <option value="food">What is your favorite food?</option>
                    <option value="pet">What is your pet’s name?</option>
                </select>
            </div>
            <div class="form-group">
                <label>Security Answer</label>
                <input type="text" name="security_answer" required>
            </div>
            <button type="submit" class="btn-primary">Register as Patient</button>
        </form>

        <!-- Doctor Form (Hidden by default) -->
        <form id="doctorForm" action="/api/register/doctor" method="POST" enctype="multipart/form-data" style="display: none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Doctor ID</label>
                    <input type="text" name="doctor_id" required placeholder="DOC123">
                </div>
            </div>
            <div class="form-group">
                <label>Specialization</label>
                <select name="specialization" required>
                    <option value="Cardiologist">Cardiologist</option>
                    <option value="Dermatologist">Dermatologist</option>
                    <option value="Neurologist">Neurologist</option>
                    <option value="Orthopedic">Orthopedic</option>
                    <option value="Pediatrician">Pediatrician</option>
                    <option value="ENT">ENT</option>
                    <option value="Gynecologist">Gynecologist</option>
                    <option value="General Physician">General Physician</option>
                </select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Experience (Years)</label>
                    <input type="number" name="experience" required>
                </div>
                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" name="qualification" required placeholder="MBBS, MD">
                </div>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>
            <div class="form-group">
                <label>Security Question</label>
                <select name="security_question" required>
                    <option value="nickname">What is your childhood nickname?</option>
                    <option value="school">What was your first school name?</option>
                    <option value="food">What is your favorite food?</option>
                    <option value="mother">What is your mother’s maiden name?</option>
                </select>
            </div>
            <div class="form-group">
                <label>Security Answer</label>
                <input type="text" name="security_answer" required>
            </div>
            <div class="form-group">
                <label>Profile Image (Optional)</label>
                <input type="file" name="profile_image" accept="image/*">
            </div>
            <button type="submit" class="btn-primary">Register as Doctor</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem;">
            Already have an account? <a href="/login" style="color: var(--secondary-color); text-decoration: none;">Login Here</a>
        </p>
    </div>

    <script>
        function switchRole(role) {
            const patientForm = document.getElementById('patientForm');
            const doctorForm = document.getElementById('doctorForm');
            const patientBtn = document.getElementById('patientBtn');
            const doctorBtn = document.getElementById('doctorBtn');

            if (role === 'patient') {
                patientForm.style.display = 'block';
                doctorForm.style.display = 'none';
                patientBtn.classList.add('active');
                doctorBtn.classList.remove('active');
            } else {
                patientForm.style.display = 'none';
                doctorForm.style.display = 'block';
                doctorBtn.classList.add('active');
                patientBtn.classList.remove('active');
            }
        }
    </script>
</body>
</html>
