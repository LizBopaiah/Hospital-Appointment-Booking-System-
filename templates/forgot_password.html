<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MediBook</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(circle at 10% 90%, #e0f2fe 0%, #ffffff 50%, #f1f5f9 100%);">
    <nav>
        <a href="/" class="logo">MediBook<span>.</span></a>
    </nav>

    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 5%;">
        <div class="form-container animated" style="margin: 0; width: 100%; max-width: 500px; box-shadow: var(--shadow-xl);">
            <div style="text-align: center; margin-bottom: 2.25rem;">
                <div style="background-color: var(--pastel-blue); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h2 class="form-title" style="margin-bottom: 0.5rem; font-size: 2rem;">Reset Password</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Follow the steps to recover your credentials.</p>
            </div>
            
            <!-- Step 1: Email & Selection -->
            <div id="step1" class="animated">
                <div style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem; align-items: center; background-color: var(--pastel-blue); padding: 0.85rem 1rem; border-radius: 8px; color: var(--secondary-hover); font-weight: 600; font-size: 0.88rem;">
                    <span style="font-size: 1.1rem;">①</span> Enter your registered email ID.
                </div>
                
                <div class="form-group">
                    <label>Registered Email</label>
                    <input type="email" id="resetEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Verification Method</label>
                    <select id="verifyMethod" style="cursor: pointer;">
                        <option value="security">Security Question</option>
                        <option value="otp">OTP via Phone (Simulated)</option>
                    </select>
                </div>
                <button class="btn-primary" style="margin-top: 1rem;" onclick="proceedToVerify()">Continue</button>
            </div>
    
            <!-- Step 2: Security Question (Dynamic) -->
            <div id="step2" style="display: none;" class="animated">
                <div style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem; align-items: center; background-color: var(--pastel-blue); padding: 0.85rem 1rem; border-radius: 8px; color: var(--secondary-hover); font-weight: 600; font-size: 0.88rem;">
                    <span style="font-size: 1.1rem;">②</span> Answer your security question.
                </div>
                
                <p id="questionText" style="margin-bottom: 1.5rem; font-weight: 600; color: var(--primary); padding: 1rem; background-color: var(--bg-light); border-radius: 10px; border: 1px solid var(--border-color);"></p>
                
                <div class="form-group">
                    <label>Your Answer</label>
                    <input type="text" id="securityAnswer" required placeholder="Your answer">
                </div>
                <button class="btn-primary" style="margin-top: 1rem;" onclick="verifySecurity()">Verify Answer</button>
            </div>
    
            <!-- Step 3: Password Reset -->
            <div id="step3" style="display: none;" class="animated">
                <div style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem; align-items: center; background-color: var(--pastel-blue); padding: 0.85rem 1rem; border-radius: 8px; color: var(--secondary-hover); font-weight: 600; font-size: 0.88rem;">
                    <span style="font-size: 1.1rem;">③</span> Establish a secure new password.
                </div>
                
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" required placeholder="••••••••">
                </div>
                <button class="btn-primary" style="margin-top: 1rem;" onclick="resetPassword()">Reset Password</button>
            </div>
            
            <p style="text-align: center; margin-top: 2rem; font-size: 0.95rem;">
                Remembered your password? <a href="/login" style="color: var(--secondary-hover); text-decoration: none; font-weight: 700; transition: var(--transition);">Login</a>
            </p>
        </div>
    </div>

    <footer style="padding: 2rem 5%; background-color: var(--primary);">
        <p style="font-size: 0.85rem; color: var(--text-light); text-align: center;">&copy; 2026 MediBook Hospital. All rights reserved.</p>
    </footer>

    <script>
        let userEmail = '';
 
        async function proceedToVerify() {
            userEmail = document.getElementById('resetEmail').value;
            const method = document.getElementById('verifyMethod').value;
 
            if (!userEmail) return alert("Please enter your email");
 
            if (method === 'security') {
                // Fetch user's security question
                const response = await fetch(`/api/forgot-password/question?email=${userEmail}`);
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    document.getElementById('questionText').innerText = `Question: ${data.question}`;
                } else {
                    alert(data.detail || "User not found");
                }
            } else {
                alert("OTP verification is simulated. For now, please use the Security Question method.");
            }
        }
 
        async function verifySecurity() {
            const answer = document.getElementById('securityAnswer').value;
            const response = await fetch('/api/forgot-password/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: userEmail, answer: answer})
            });
 
            if (response.ok) {
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
            } else {
                alert("Incorrect answer");
            }
        }
 
        async function resetPassword() {
            const pass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmNewPassword').value;
 
            if (pass !== confirm) return alert("Passwords do not match");
 
            const response = await fetch('/api/forgot-password/reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: userEmail, new_password: pass})
            });
 
            if (response.ok) {
                alert("Password reset successfully!");
                window.location.href = '/login';
            } else {
                alert("Error resetting password");
            }
        }
    </script>
</body>
</html>
