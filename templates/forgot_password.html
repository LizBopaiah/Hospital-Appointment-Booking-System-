<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MediBook</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">MediBook</a>
    </nav>

    <div class="form-container">
        <h2 class="form-title">Reset Password</h2>
        
        <!-- Step 1: Email & Selection -->
        <div id="step1">
            <div class="form-group">
                <label>Registered Email</label>
                <input type="email" id="resetEmail" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Verification Method</label>
                <select id="verifyMethod">
                    <option value="security">Security Question</option>
                    <option value="otp">OTP via Phone (Simulated)</option>
                </select>
            </div>
            <button class="btn-primary" onclick="proceedToVerify()">Continue</button>
        </div>

        <!-- Step 2: Security Question (Dynamic) -->
        <div id="step2" style="display: none;">
            <p id="questionText" style="margin-bottom: 1rem; font-weight: 500; color: var(--primary-color);"></p>
            <div class="form-group">
                <label>Your Answer</label>
                <input type="text" id="securityAnswer" required>
            </div>
            <button class="btn-primary" onclick="verifySecurity()">Verify</button>
        </div>

        <!-- Step 3: Password Reset -->
        <div id="step3" style="display: none;">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required>
            </div>
            <button class="btn-primary" onclick="resetPassword()">Reset Password</button>
        </div>
        
        <p style="text-align: center; margin-top: 1.5rem;">
            Remembered your password? <a href="/login" style="color: var(--secondary-color); text-decoration: none;">Login</a>
        </p>
    </div>

    <script>
        let userEmail = '';

        async function proceedToVerify() {
            userEmail = document.getElementById('resetEmail').value;
            const method = document.getElementById('verifyMethod').value;

            if (!userEmail) return alert("Please enter your email");

            if (method === 'security') {
                // Fetch user's security question
                const response = await fetch(`/api/forgot-password/question?email=${userEmail}`);
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    document.getElementById('questionText').innerText = `Question: ${data.question}`;
                } else {
                    alert(data.detail || "User not found");
                }
            } else {
                alert("OTP verification is simulated. For now, please use the Security Question method.");
            }
        }

        async function verifySecurity() {
            const answer = document.getElementById('securityAnswer').value;
            const response = await fetch('/api/forgot-password/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: userEmail, answer: answer})
            });

            if (response.ok) {
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
            } else {
                alert("Incorrect answer");
            }
        }

        async function resetPassword() {
            const pass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmNewPassword').value;

            if (pass !== confirm) return alert("Passwords do not match");

            const response = await fetch('/api/forgot-password/reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: userEmail, new_password: pass})
            });

            if (response.ok) {
                alert("Password reset successfully!");
                window.location.href = '/login';
            } else {
                alert("Error resetting password");
            }
        }
    </script>
</body>
</html>
